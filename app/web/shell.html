<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>作战面板 v2</title>
<link rel="icon" type="image/x-icon" href="/static/panel-v2.ico" />
<!-- 主题唯一源 = legacy/themes.css（sync_vendor 从 engine/web/themes.css 同步）。
     批次 0 纪律：**不复制**第二份色表，v2 壳与旧壳共用同一份 token；
     core 的 /static 指向 app/web/，故这里按已挂载的 /legacy 静态路由引用。 -->
<link rel="stylesheet" href="/legacy/themes.css" />
<link rel="stylesheet" href="/static/shell.css" />
</head>
<body>
<aside class="rail" id="rail">
  <button type="button" class="rail-btn" id="rail-search" aria-label="搜索" title="搜索（股票 / ETF / 板块）">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.6"/><path d="M20 20l-4.2-4.2"/></svg>
    <span class="tip">搜索</span>
  </button>
  <div class="rail-tabs" id="rail-tabs"></div>
  <div class="rail-spacer"></div>
  <!-- 标注清单（2026-10-27）：标注的**看板**——按页面分组 + 阶段流转（/api/ui_notes/stage）。
       与下面「标注模式」的分工：那个负责点选/写新标注，这个负责看全貌、推进阶段。
       节点与交互全在 /static/v2_notes_panel.js（np- 前缀），本按钮只是入口。 -->
  <button type="button" class="rail-btn" id="rail-notes" aria-label="标注清单" aria-pressed="false" title="标注清单：按页面看全部标注并推进阶段">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5h-7.2L7 20.5v-4H5A1.5 1.5 0 0 1 3.5 15V6A1.5 1.5 0 0 1 5 4.5z"/><path d="M7.5 8.5h9M7.5 11.8h5.5"/></svg>
    <span class="tip">标注清单</span>
  </button>
  <!-- 标注模式（2026-10-26）：点任意元素写意见 → /api/ui_notes/add（page 以 v2: 前缀区分旧页）。
       入口 2026-10-28 改为 v2_note.js 自建的**悬浮可拖动按钮**（z 高于 K 线弹窗）：
       rail 按钮会被弹窗遮罩压住，标 K 线图时点不到。此处不再放 rail 按钮。 -->
  <button type="button" class="rail-btn" id="rail-gear" aria-label="设置" title="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"/></svg>
    <span class="lamp" id="gear-lamp"></span>
    <span class="tip">设置</span>
  </button>
</aside>

<main class="main" id="main">
  <header class="main-head">
    <h1 class="main-title" id="main-title">面板</h1>
    <span class="main-sub" id="main-sub"></span>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="stage" id="stage" aria-live="polite">
    <div class="empty" id="empty">正在加载插件…</div>
  </section>
</main>

<div class="scrim" id="scrim"></div>

<!-- 设置抽屉：照搬旧壳 #drawer（引擎状态 / 主题 / 字号 / 操作 / 服务） -->
<aside class="drawer" id="drawer" aria-label="设置">
  <div class="dr-hd"><span class="dr-t">设置</span><button type="button" class="dr-x" id="drawer-close" aria-label="关闭">✕</button></div>
  <div class="dr-body">
    <div class="sec">
      <div class="sec-t">引擎状态</div>
      <div class="stat s-readonly" id="stat"><span class="dot"></span><span class="lab" id="stat-lab">加载中…</span><span class="dd" id="stat-data"></span><span class="ts" id="stat-ts"></span></div>
      <div class="hint" id="stat-hint"></div>
    </div>
    <div class="sec">
      <div class="sec-t">主题</div>
      <select id="theme-sel" aria-label="主题"></select>
    </div>
    <div class="sec">
      <div class="sec-t">字体大小</div>
      <div class="seg" id="fs-seg">
        <button type="button" data-fs="sm">小</button><button type="button" data-fs="md">中</button><button type="button" data-fs="lg">大</button>
      </div>
    </div>
    <div class="sec">
      <div class="sec-t">操作</div>
      <div class="row">
        <button type="button" class="btn danger" id="btn-kill">⛔ 急停</button>
      </div>
      <div class="msg" id="act-msg"></div>
    </div>
    <div class="sec">
      <div class="sec-t">服务</div>
      <div class="row"><button type="button" class="btn" id="btn-restart">↻ 重启面板</button></div>
      <div class="hint">重启作战面板进程（8810）：约 3–6 秒不可用，就绪后本页自动刷新。旧 8800 引擎已退役，不在本按钮范围内。</div>
      <div class="msg" id="svc-msg"></div>
    </div>
    <div class="sec">
      <div class="sec-t">面板</div>
      <div class="row"><button type="button" class="btn" id="btn-reload">重新加载插件</button></div>
      <div class="msg" id="core-version"></div>
    </div>
  </div>
  <div class="dr-ft">v2 壳 · 主题唯一源 legacy/themes.css</div>
</aside>

<!-- 搜索面板：照搬旧壳 #sPanel / ShellSearch 交互，fetch 打本进程 /api/shell/search -->
<div class="s-panel" id="s-panel" hidden>
  <div class="sp-hd">
    <input id="s-input" type="text" placeholder="代码 / 名称 / 拼音首字母" autocomplete="off" spellcheck="false" />
    <button type="button" id="s-close" aria-label="关闭">✕</button>
  </div>
  <div id="s-body" class="sp-body"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="/static/shell.js"></script>
<!-- 标注模块：shell.js 里 init（不在这里 import，避免与 shell.js 的启动顺序耦合） -->
<script type="module" src="/static/v2_note.js"></script>
<!-- 标注清单面板：同样由 shell.js 动态 import（见 bindNotesPanel），此处不引，避免两份实例 -->
</body>
</html>
